name: Validate packs

on:
  push:
    branches: [master]
    paths:
      - "packs/**"
      - "scripts/**"
      - ".github/workflows/packs.yml"
  pull_request:
    paths:
      - "packs/**"
      - "scripts/**"
      - ".github/workflows/packs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOMAD_VERSION: "1.9.3"
  NOMAD_PACK_VERSION: "0.4.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint pack format
        run: node scripts/lint-packs.mjs

  render-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nomad-pack and nomad
        run: |
          cd /tmp
          curl -fsSL -o nomad-pack.zip "https://releases.hashicorp.com/nomad-pack/${NOMAD_PACK_VERSION}/nomad-pack_${NOMAD_PACK_VERSION}_linux_amd64.zip"
          curl -fsSL -o nomad.zip "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -o nomad-pack.zip && unzip -o nomad.zip
          sudo mv nomad-pack nomad /usr/local/bin/
          nomad-pack version && nomad version
      - name: Start Nomad dev agent
        run: |
          sudo nomad agent -dev -log-level=ERROR > /tmp/nomad.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4646/v1/agent/health >/dev/null 2>&1; then
              echo "nomad agent ready"; exit 0
            fi
            sleep 1
          done
          echo "nomad agent did not become ready"; cat /tmp/nomad.log; exit 1
      - name: Render + validate every pack
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: bash scripts/validate-packs.sh

  smoke-test:
    # Boots the packs changed in this PR against a real Nomad dev agent (docker
    # driver) and checks each actually comes up and stays running — a stronger
    # signal than `nomad job validate`. It's informational: keep it out of the
    # required checks while it beds in.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install nomad-pack and nomad
        run: |
          cd /tmp
          curl -fsSL -o nomad-pack.zip "https://releases.hashicorp.com/nomad-pack/${NOMAD_PACK_VERSION}/nomad-pack_${NOMAD_PACK_VERSION}_linux_amd64.zip"
          curl -fsSL -o nomad.zip "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -o nomad-pack.zip && unzip -o nomad.zip
          sudo mv nomad-pack nomad /usr/local/bin/
      - name: Start Nomad dev agent (with docker driver)
        run: |
          sudo nomad agent -dev -log-level=ERROR > /tmp/nomad.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4646/v1/agent/health >/dev/null 2>&1; then
              echo "nomad agent ready"; exit 0
            fi
            sleep 1
          done
          echo "nomad agent did not become ready"; cat /tmp/nomad.log; exit 1
      - name: Smoke-test changed packs
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'master' }}
        run: bash scripts/smoke-test.sh

  publish-health:
    # On merge to master, smoke-test the packs that changed in this push and
    # publish the boot results to site/src/data/health.json (the "boots ✓/✗"
    # badge on the site). Writes back to master; the site/ path doesn't retrigger
    # this workflow, so there's no loop. Resilient: never fails the build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install nomad-pack and nomad
        run: |
          cd /tmp
          curl -fsSL -o nomad-pack.zip "https://releases.hashicorp.com/nomad-pack/${NOMAD_PACK_VERSION}/nomad-pack_${NOMAD_PACK_VERSION}_linux_amd64.zip"
          curl -fsSL -o nomad.zip "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -o nomad-pack.zip && unzip -o nomad.zip
          sudo mv nomad-pack nomad /usr/local/bin/
      - name: Start Nomad dev agent (with docker driver)
        run: |
          sudo nomad agent -dev -log-level=ERROR > /tmp/nomad.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4646/v1/agent/health >/dev/null 2>&1; then
              echo "nomad agent ready"; exit 0
            fi
            sleep 1
          done
          echo "nomad agent did not become ready"; cat /tmp/nomad.log; exit 1
      - name: Smoke-test packs changed in this push
        continue-on-error: true
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
          BASE_REF: ${{ github.event.before }}
          HEALTH_OUT: /tmp/health.tsv
        run: bash scripts/smoke-test.sh
      - name: Publish health results
        run: |
          [ -s /tmp/health.tsv ] || { echo "no results to publish"; exit 0; }
          node scripts/merge-health.mjs /tmp/health.tsv site/src/data/health.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/data/health.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: publish pack boot health"
          git pull --rebase --autostash origin master || true
          git push origin HEAD:master || echo "push failed (branch protection?) — health not published this run"
